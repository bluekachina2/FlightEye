name: Build FlightEye APK

on:
  workflow_dispatch:  # Allows you to manually click to run from the Actions page
  push:
    branches: [ "master", "main" ]  # Also triggers when you modify code

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlightEye-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
